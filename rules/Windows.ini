; MakeCleaner - Windows tab rules (own clean-room set, winapp2 format).
; Written from Windows documentation/known OS folder layout; not derived from any other cleaner's data.
; Section= picks the group in the Windows tab; sections appear in file order.
; SpecialKey= names a built-in procedure (Special.cs); AgeOption= names an Options setting that limits
; the rule to files older than 24 hours.

[Recent Documents]
Section=Windows Explorer
Default=False
FileKey1=%AppData%\Microsoft\Windows\Recent|*.lnk
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RecentDocs

[Run (in Start Menu)]
Section=Windows Explorer
Default=True
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU

[Typed Paths]
Section=Windows Explorer
Default=True
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths

[Search History]
Section=Windows Explorer
Default=True
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\WordWheelQuery

[Thumbnail Cache]
Section=Windows Explorer
Default=True
FileKey1=%LocalAppData%\Microsoft\Windows\Explorer|thumbcache_*.db

[Jump Lists]
Section=Windows Explorer
Default=False
FileKey1=%AppData%\Microsoft\Windows\Recent\AutomaticDestinations|*.automaticDestinations-ms
FileKey2=%AppData%\Microsoft\Windows\Recent\CustomDestinations|*.customDestinations-ms

[Empty Recycle Bin]
Section=System
Default=True
SpecialKey1=RECYCLEBIN
AgeOption=RecycleBinOlderThan24h

[Temporary Files]
Section=System
Default=True
FileKey1=%TEMP%|*.*|RECURSE
AgeOption=TempOlderThan24h

[Windows Temporary Files]
Section=System
Default=True
FileKey1=%windir%\Temp|*.*|RECURSE
AgeOption=TempOlderThan24h

[Clipboard]
Section=System
Default=True
SpecialKey1=CLIPBOARD

[Memory Dumps]
Section=System
Default=True
FileKey1=%windir%|MEMORY.DMP
FileKey2=%windir%\Minidump|*.dmp
FileKey3=%windir%\LiveKernelReports|*.dmp|RECURSE
FileKey4=%LocalAppData%\CrashDumps|*.dmp

[Chkdsk File Fragments]
Section=System
Default=True
FileKey1=%SystemDrive%\|File*.chk
FileKey2=%SystemDrive%\found.*|*.chk|REMOVESELF

[Windows Log Files]
Section=System
Default=True
FileKey1=%windir%|*.log
FileKey2=%windir%\Logs\CBS|*.log;*.cab
FileKey3=%windir%\Logs\DISM|*.log
FileKey4=%windir%\Logs\MoSetup|*.log
FileKey5=%windir%\Logs\WindowsUpdate|*.etl
FileKey6=%windir%\Panther|*.log
FileKey7=%windir%\SoftwareDistribution|*.log
FileKey8=%LocalAppData%\Microsoft\CLR_v4.0\UsageLogs|*.log

[Windows Error Reporting]
Section=System
Default=False
FileKey1=%ProgramData%\Microsoft\Windows\WER\ReportArchive|*.*|RECURSE
FileKey2=%ProgramData%\Microsoft\Windows\WER\ReportQueue|*.*|RECURSE
FileKey3=%LocalAppData%\Microsoft\Windows\WER\ReportArchive|*.*|RECURSE
FileKey4=%LocalAppData%\Microsoft\Windows\WER\ReportQueue|*.*|RECURSE

[DNS Cache]
Section=System
Default=False
SpecialKey1=DNSCACHE

[Windows Event Logs]
Section=Advanced
Default=False
SpecialKey1=EVENTLOGS
Warning=Clears every Windows event log (asks for administrator rights). The event history used for troubleshooting is lost. Continue?

[Old Prefetch Data]
Section=Advanced
Default=False
FileKey1=%windir%\Prefetch|*.pf
Warning=Windows rebuilds prefetch data on its own; programs may start slower for a while. Needs administrator rights. Continue?

[Broken Start Menu Shortcuts]
Section=Advanced
Default=False
SpecialKey1=BROKENSTARTMENU
Warning=Removes Start Menu shortcuts whose target no longer exists on a local fixed drive. Continue?

[Broken Desktop Shortcuts]
Section=Advanced
Default=False
SpecialKey1=BROKENDESKTOP
Warning=Removes Desktop shortcuts whose target no longer exists on a local fixed drive. Continue?

[Wipe Free Space]
Section=Advanced
Default=False
SpecialKey1=WIPEFREESPACE
Warning=Wipe Free Space overwrites all free space on the system drive. It is slow, temporarily fills the drive and wears SSDs. Continue?
